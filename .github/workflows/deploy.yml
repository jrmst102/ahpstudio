name: CI — AHP Studio

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install server dependencies
      working-directory: ./server
      run: npm ci
      
    - name: Run server tests
      working-directory: ./server
      run: npm test
      
  build:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install client dependencies
      working-directory: ./client
      run: npm ci
      
    - name: Build client
      working-directory: ./client
      run: npm run build
